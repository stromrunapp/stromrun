<style>
:root{--bg:#0d0a06;--card:#1a140c;--line:#3a2c14;--gold:#ffb524;--gold2:#ff9a1f;--text:#f6ecd8;--muted:#a89572;--ok:#4ade80;--bad:#f87171}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Outfit',system-ui,sans-serif}
body{min-height:100vh;background:radial-gradient(120% 60% at 50% 0,#2a1c07 0,var(--bg) 60%)}
.app{max-width:480px;margin:0 auto;padding:12px 16px 130px}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px}
.who{font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.bal{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-weight:800;color:var(--gold)}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:14px}
h2{margin:6px 0 12px;font-size:22px}
h3{margin:0 0 4px;font-size:18px}
.muted{color:var(--muted);font-size:14px}
.row{display:flex;align-items:center;gap:14px}
.grow{flex:1;min-width:0}
.btn{border:0;border-radius:14px;padding:13px 18px;font:700 16px 'Outfit',sans-serif;color:#2b1a00;background:linear-gradient(180deg,#ffd35a,var(--gold2));cursor:pointer}
.btn.block{width:100%}.btn.sm{padding:10px 16px;font-size:15px}
.btn:disabled{opacity:.45;filter:grayscale(.6)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.pill{display:inline-block;background:#2a1f0d;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:3px 10px;font-weight:700;font-size:14px}
.bar{height:8px;background:#2a1f0d;border-radius:9px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),#ffd35a)}
/* wheel */
.wheelbox{position:relative;width:190px;height:190px;margin:4px auto 14px}
#wheel{position:absolute;inset:0;border-radius:50%;border:4px solid var(--gold);background:conic-gradient(#6b4a1c 0 60deg,#c9a46a 60deg 120deg,#8a5a1f 120deg 180deg,#e0c08a 180deg 240deg,#5a3a14 240deg 300deg,#b88a48 300deg 360deg);transition:transform 4s cubic-bezier(.12,.7,.1,1)}
#wheel span{position:absolute;left:50%;top:50%;font-weight:800;font-size:16px;color:#fff;text-shadow:0 1px 3px #000}
.ptr{position:absolute;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border:10px solid transparent;border-top:18px solid #fff;z-index:2}
/* checkin */
.days{display:flex;justify-content:space-between;margin:14px 0}
.day{width:38px;text-align:center;font-size:12px;color:var(--muted)}
.day b{display:flex;width:36px;height:36px;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font-size:15px;color:var(--text);margin-bottom:4px}
.day.done b{background:var(--gold);color:#2b1a00;border-color:var(--gold)}
.day.now b{border-color:var(--gold);color:var(--gold)}
/* inputs */
input,select{width:100%;background:#120d06;border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px;font:16px 'Outfit',sans-serif;margin:6px 0 10px}
label{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:8px;margin-bottom:10px}
.seg button{flex:1}
/* games */
.ttt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:12px auto}
.ttt button{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:#120d06;color:var(--gold);font:800 36px 'Outfit';cursor:pointer}
.ttt button.o{color:#fff}
canvas{display:block;margin:10px auto;background:#120d06;border:2px solid var(--line);border-radius:14px;touch-action:none}
.pad{display:grid;grid-template-columns:repeat(3,56px);gap:6px;justify-content:center;margin-top:8px}
.pad button{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:20px}
/* list */
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border:0}
.st-pending{color:var(--gold)}.st-paid{color:var(--ok)}.st-rejected{color:var(--bad)}
/* nav */
nav{position:fixed;left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));width:min(448px,calc(100% - 24px));display:flex;justify-content:space-around;align-items:center;background:#16100a;border:1px solid var(--line);border-radius:28px;padding:8px 6px}
nav button{background:none;border:0;color:var(--muted);font:600 12px 'Outfit';padding:8px 10px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px}
nav button.on{color:var(--text);background:#2a1f0d}
nav .mid{margin-top:-34px;width:68px;height:68px;border-radius:50%;border:3px solid var(--gold);background:#120d06;color:var(--gold)}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-90px);background:#2a1f0d;border:1px solid var(--gold);color:var(--text);padding:10px 16px;border-radius:14px;font-weight:600;z-index:50;transition:transform .3s;max-width:90%;text-align:center}
#toast.show{transform:translate(-50%,0)}
#adov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:60;text-align:center;padding:24px}
#adov.on{display:flex}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:70;text-align:center;padding:24px}
/* games hub */
#v-games .gwrap{background:linear-gradient(180deg,#1b1240 0%,#120c2e 55%,#0d0a06 100%);border:1px solid #3b2a7a;border-radius:26px;padding:16px 14px 18px;margin-bottom:14px}
.ghead{display:flex;justify-content:space-between;align-items:center}
.gtitle{font-size:26px;font-weight:800}.gsub{color:#a9a0d6;font-size:13px}
.gbadge{width:46px;height:46px;border-radius:14px;background:#2a1f5c;display:flex;align-items:center;justify-content:center;font-size:24px}
.gsec{font-weight:800;font-size:16px;margin:18px 2px 10px;color:#e9e4ff}
.gscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.gcard,.gtile{background:linear-gradient(180deg,#241a55,#171038);border:1px solid #3b2a7a;border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.gcard{flex:0 0 132px;scroll-snap-align:start}
.gico{width:78px;height:78px;border-radius:20px;background:var(--g);display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.gtile .gico{width:92px;height:92px;font-size:48px;border-radius:24px}
.gname{font-weight:800;font-size:14px;line-height:1.15;min-height:32px;display:flex;align-items:center}
.gchips{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12px;color:#ffd35a;font-weight:700}
.gchips span{background:#2a1f5c;border-radius:99px;padding:3px 8px}
.gplay{width:100%;border:0;border-radius:12px;padding:9px 0;font:800 13px 'Outfit',sans-serif;letter-spacing:.5px;color:#fff;background:linear-gradient(180deg,#8b5cf6,#6d28d9);cursor:pointer}
.gplay:disabled{opacity:.5;filter:grayscale(.6)}
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gtiles .gtile:last-child:nth-child(odd){grid-column:1 / -1}
/* sudoku */
.sdg{display:grid;grid-template-columns:repeat(9,1fr);width:100%;max-width:342px;margin:12px auto;border:2px solid var(--gold);border-radius:8px;overflow:hidden}
.sdc{aspect-ratio:1;border:0;border-right:1px solid #3a2c14;border-bottom:1px solid #3a2c14;background:#120d06;color:#ffd35a;font:700 18px 'Outfit',sans-serif;padding:0;cursor:pointer}
.sdc.fx{color:#f6ecd8;background:#1d160b}
.sdc.sel{background:#4a3410}.sdc.same{background:#2f2310}
.sdc.br{border-right:2px solid var(--gold)}.sdc.bb{border-bottom:2px solid var(--gold)}
.sdpad{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;max-width:342px;margin:0 auto}
.sdpad button{height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--gold);font:700 17px 'Outfit',sans-serif;padding:0}
</style>
</head>
<body>
<div id="boot">Loading...</div>
<div id="toast"></div>
<div id="adov"><div style="font-size:42px">📺</div><h3 id="adname">Ad</h3><p class="muted">Test ad (DEV_MODE). Real ads live mode me aayenge.</p><h2 id="adcount">3</h2></div>

<div class="app">
  <header><div class="who" id="who"></div><div class="bal"><span id="bal">0</span> pts</div></header>

  <!-- HOME -->
  <section id="v-home" class="view on">
    <div class="card">
      <div class="muted">Daily bonus</div>
      <h2 style="margin-top:2px">Lucky Spin</h2>
      <div class="wheelbox"><div class="ptr"></div><div id="wheel"></div></div>

<nav>
  <button data-v="home" class="on"><span class="ic">🏠</span>Home</button>
  <button data-v="tasks"><span class="ic">📋</span>Tasks</button>
  <button data-v="games" class="mid"><span class="ic">⚡</span>Games</button>
  <button data-v="refer"><span class="ic">👥</span>Refer</button>
  <button data-v="profile"><span class="ic">👤</span>Profile</button>

<script>
/* =====================  CONFIG (yahan apni values daalo)  ===================== */
const CFG = {
  DEV_MODE: false,               // true = nakli test ads. Live karne se pehle false karo
  firebase: {
    apiKey: "AIzaSyBqhrGluioAeZP4tjza1DLBz2ExbCsgYd8", authDomain: "stromrun.firebaseapp.com", projectId: "stromrun",
    storageBucket: "stromrun.firebasestorage.app", messagingSenderId: "1065505906139", appId: "1:1065505906139:web:c2d00a94a002b4d4cb9bfe"
  },
  botUsername: "stromrun_bot",       // bot ka username (@ ke bina)
  appShortName: "app",          // BotFather /newapp me jo short name diya
  monetagZone: "12041320",       // Monetag zone id (function show_ZONE_ID banta hai)
  monetagSrc: "//libtl.com/sdk.js", // Monetag dashboard ke snippet se match karo
  gigaId: "GIGAPUB_ID",         // GigaPub project id
  adexiumWid: "d44a1369-6328-4ce1-9a89-18f59cfe0897", // Adexium Placement ID (WID)
  adsgramBlockId: "54605", // Adsgram dashboard se Rewarded Block ID (jaise "12345")
  gigaSrc: "https://ad.gigapub.tech/script?id=", // GigaPub dashboard ke snippet se match karo

  spinsPerDay: 3, spinRewards: [10, 20, 30, 50, 100, 200],
  adLimits: { mt: 10, gp: 10, ax: 10, rich: 15, ag: 15 }, adCooldownSec: 5,   // har network ke ads, har ad ke baad 5 sec wait, limit ke baad 24 ghante lock
  adReward: { mt: 60, gp: 80, ax: 90, rich: 90, ag: 90 },
  checkin: [100, 150, 200, 250, 300, 350, 500],
  gameLimit: 5,                 // har game ke 5 plays, fir 24 ghante ka lock
  tttPts: { win: 100, draw: 50, lose: 20 },
  snakePts: { perFood: 5, min: 20, max: 100 },
  quizPts: { questions: 5, perCorrect: 20, min: 20 },
  sudokuPts: { blanks: 36, solved: 100, perMistake: 10, min: 40, fail: 20, maxMistakes: 5 },
  archeryPts: { arrows: 5, perPoint: 2, min: 20, max: 100 },
  tennisPts: { target: 5, win: 100, lose: 20 },
  refBonus: { referrer: 500, newUser: 200 },
  pointsPerINR: 1000, pointsPerUSDT: 90000, minINR: 10, minUSDT: 1
};
/* ============================================================================== */

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n || 0).toLocaleString('en-IN');
const IST = 19800000;
const today = () => new Date(Date.now() + IST).toISOString().slice(0, 10);
const yesterday = () => new Date(Date.now() + IST - 86400000).toISOString().slice(0, 10);
const newDaily = () => ({ date: today(), spins: 0, mt: 0, gp: 0, ttt: 0, snake: 0 });

let TG, db, auth, ref, U, tid, busy = false, method = 'UPI';
const inc = n => firebase.firestore.FieldValue.increment(n);

function errMsg(e) {
  if (!e) return 'ad poora nahi hua (koi detail nahi)';
  if (typeof e === 'string') return e;
  if (e.description) return e.description;
  if (e.message) return e.message;
  try { return JSON.stringify(e); } catch (x) { return String(e); }
}
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 5000);
}

/* ---------- ads ---------- */
function loadScript(src, attrs = {}) {
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    Object.entries(attrs).forEach(([k, v]) => s.setAttribute(k, v));
    s.onload = res; s.onerror = () => rej(new Error('script load fail'));
    document.head.appendChild(s);
  });
}
async function fakeAd(name) {
  $('adname').textContent = name + ' ad'; $('adov').classList.add('on');
  for (let i = 3; i > 0; i--) { $('adcount').textContent = i; await sleep(1000); }
  $('adov').classList.remove('on');
}
async function adMonetag() {
  if (CFG.DEV_MODE) return fakeAd('Monetag');
  const fn = window['show_' + CFG.monetagZone];
  if (typeof fn !== 'function') throw new Error('Monetag ready nahi');
  await fn();
}
async function adGiga() {
  if (CFG.DEV_MODE) return fakeAd('GigaPub');
  if (typeof window.showGiga !== 'function') throw new Error('GigaPub abhi set nahi hai');
  await window.showGiga("main");
}
const adsgramReady = () => !!CFG.adsgramBlockId && CFG.adsgramBlockId !== 'ADSGRAM_BLOCK_ID';
async function adAdsgram() {
  if (CFG.DEV_MODE) return fakeAd('Adsgram');
  if (!adsgramReady()) throw new Error('Adsgram Block ID set nahi hai');
  if (!window.Adsgram) throw new Error('Adsgram load nahi hua');
  await window.Adsgram.init({ blockId: CFG.adsgramBlockId }).show();
}
async function adRichAds() {
  if (CFG.DEV_MODE) return fakeAd('RichAds');
  const ctl = window.TelegramAdsController;
  if (!ctl) throw new Error('RichAds load nahi hua');
  const fn = ctl.triggerInterstitialVideo || ctl.triggerInterstitialBanner;
  if (typeof fn !== 'function') throw new Error('RichAds method nahi mila');
  const r = fn.call(ctl);
  if (r && typeof r.then === 'function') await r;   // promise mile to ad poora hone tak ruko
  else await sleep(6000);                           // warna kuch der ruko (completion signal nahi milta)
}
async function loadAdSdks() {
  if (CFG.DEV_MODE) return;
  // Monetag aur GigaPub ke scripts <head> me pehle se lage hain
}

/* ---------- init ---------- */
async function init() {
  TG = window.Telegram && Telegram.WebApp;
  if (TG) { TG.ready(); TG.expand(); try { TG.disableVerticalSwipes(); } catch (e) {} }
  const tu = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
  if (!tu) {
    $('boot').innerHTML = '<div><h3>Telegram me kholo</h3><p class="muted">Ye app Telegram ke andar chalta hai. Bot kholke Open App dabao.</p></div>';
    return;
  }
  tid = String(tu.id);
  const name = tu ? (tu.first_name + (tu.last_name ? ' ' + tu.last_name : '')) : 'Test User';

  firebase.initializeApp(CFG.firebase);
  db = firebase.firestore(); auth = firebase.auth();
  await auth.signInAnonymously();
  ref = db.collection('users').doc(tid);
  let snap = await ref.get();
  if (!snap.exists) {
    const sp = (TG && TG.initDataUnsafe && TG.initDataUnsafe.start_param) || new URLSearchParams(location.search).get('ref') || '';
    const refBy = sp.startsWith('ref_') && sp.slice(4) !== tid ? sp.slice(4) : '';
    await ref.set({
      uid: auth.currentUser.uid, name, email: '', tgName: name, tgUsername: (tu && tu.username) || '', points: 0, totalEarned: 0, referredBy: refBy, referralCount: 0,
      activated: false, streak: 0, lastCheckin: '', daily: newDaily(),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    snap = await ref.get();
  }
  U = snap.data();
  if (U.uid !== auth.currentUser.uid) {
    $('boot').innerHTML = '<div><h3>Account lock hai</h3><p class="muted">Is account ka secure login badal gaya hai. Admin se sampark karo.</p></div>';
    return;
  }
  if (!U.daily || U.daily.date !== today()) { U.daily = newDaily(); await ref.update({ daily: U.daily }); }
  await claimRefs();
  buildWheel(); bindNav(); renderAll(); loadHistory(); setInterval(tick, 1000);
  loadAdSdks();
  $('boot').style.display = 'none';
}

/* ---------- points ---------- */
async function earn(pts, fields = {}, after = null) {
  await ref.update({ points: inc(pts), totalEarned: inc(pts), ...fields });
  U.points += pts; U.totalEarned = (U.totalEarned || 0) + pts;
  if (after) after();
  if (!U.activated) await activate();
  renderAll();
}
async function activate() {
  U.activated = true;
  await ref.update({ activated: true });
  if (U.referredBy) {
    try {
      await db.collection('referrals').doc(tid).set({ referrer: U.referredBy, referee: tid, name: U.name, rewarded: false });
      await earn(CFG.refBonus.newUser);
    } catch (e) { console.warn(e); }
  }
}
async function claimRefs() {
  try {
    const q = await db.collection('referrals').where('referrer', '==', tid).where('rewarded', '==', false).get();
    for (const d of q.docs) {
      const b = db.batch();
      b.update(d.ref, { rewarded: true });

/* tic tac toe */
let tb, tOver, tBusy = false, tGen = 0;
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function tWin(b) {
  for (const [a, c, d] of LINES) if (b[a] && b[a] === b[c] && b[a] === b[d]) return b[a];
  return b.every(x => x) ? 'D' : null;
}
function minimax(b, p) {
  const w = tWin(b); if (w === 'O') return 1; if (w === 'X') return -1; if (w === 'D') return 0;
  let best = p === 'O' ? -2 : 2;
  for (let i = 0; i < 9; i++) if (!b[i]) {
    b[i] = p; const s = minimax(b, p === 'O' ? 'X' : 'O'); b[i] = '';
    best = p === 'O' ? Math.max(best, s) : Math.min(best, s);
  }
  return best;
}
function cpuPick() {
  const empty = tb.map((v, i) => v ? -1 : i).filter(i => i >= 0);
  if (Math.random() < 0.4) return empty[Math.floor(Math.random() * empty.length)]; // kabhi kabhi galti, taaki jeet sako
  let bi = empty[0], bs = -2;
  for (const i of empty) { tb[i] = 'O'; const s = minimax(tb, 'X'); tb[i] = ''; if (s > bs) { bs = s; bi = i; } }
  return bi;
}
function tttStart() { tGen++; tBusy = false; tb = Array(9).fill(''); tOver = false; tttDraw(''); }
function tttDraw(msg) {
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Tic Tac Toe</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <div class="muted">Aap = X, computer = O</div>
    <div class="ttt">${tb.map((v, i) => `<button class="${v === 'O' ? 'o' : ''}" onclick="tttClick(${i})">${v}</button>`).join('')}</div>
    <div style="text-align:center;font-weight:700;min-height:24px">${msg}</div>
    ${tOver ? againHtml() : ''}</div>`;
  if (tOver) updateAgain();
}
async function tttClick(i) {
  if (tOver || tb[i] || tBusy) return;
  const gen = tGen; tBusy = true;
  tb[i] = 'X'; let w = tWin(tb);
  if (!w) {
    tttDraw(''); await sleep(350);
    if (gen !== tGen) return;
    tb[cpuPick()] = 'O'; w = tWin(tb);
  }
  if (!w) { tttDraw(''); tBusy = false; return; }
  tOver = true;
  const r = w === 'X' ? 'win' : w === 'O' ? 'lose' : 'draw', pts = CFG.tttPts[r];
  tttDraw((r === 'win' ? '🎉 Aap jeet gaye!' : r === 'draw' ? 'Draw!' : 'Computer jeet gaya') + ` +${pts} pts`);
  tBusy = false;
  try { await earn(pts); } catch (e) { toast('Error: points save nahi hue'); }
}

/* snake */
const G = 15, CELL = 20; let sn = null;
function snakeStart() {
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Snake</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <div class="muted" id="snScore">Score: 0</div>
    <canvas id="cv" width="${G * CELL}" height="${G * CELL}"></canvas>
    <div class="pad"><span></span><button onclick="turn(0,-1)">▲</button><span></span><button onclick="turn(-1,0)">◀</button><button onclick="turn(0,1)">▼</button><button onclick="turn(1,0)">▶</button></div>
    <div id="snEnd"></div></div>`;
  sn = { body: [{ x: 7, y: 7 }], dir: { x: 1, y: 0 }, next: { x: 1, y: 0 }, score: 0, over: false, timer: null };
  sn.food = rndFood();
  let sx, sy; const cv = $('cv');
  cv.ontouchstart = e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; };
  cv.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    Math.abs(dx) > Math.abs(dy) ? turn(dx > 0 ? 1 : -1, 0) : turn(0, dy > 0 ? 1 : -1);
  };
  sn.timer = setInterval(snakeTick, 140); snakeDraw();
}
function rndFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * G), y: Math.floor(Math.random() * G) };
    if (!sn.body.some(s => s.x === f.x && s.y === f.y)) return f;
  }
}
function turn(x, y) { if (sn && !sn.over && !(x === -sn.dir.x && y === -sn.dir.y)) sn.next = { x, y }; }
function snakeStop() { if (sn && sn.timer) clearInterval(sn.timer); sn = null; }
function snakeTick() {
  if (!sn || sn.over) return;
  sn.dir = sn.next;
  const h = { x: sn.body[0].x + sn.dir.x, y: sn.body[0].y + sn.dir.y };
  if (h.x < 0 || h.y < 0 || h.x >= G || h.y >= G || sn.body.some(s => s.x === h.x && s.y === h.y)) return snakeEnd();
  sn.body.unshift(h);
  if (h.x === sn.food.x && h.y === sn.food.y) { sn.score++; sn.food = rndFood(); $('snScore').textContent = 'Score: ' + sn.score; }
  else sn.body.pop();
  snakeDraw();
}
function snakeDraw() {
  const c = $('cv'); if (!c || !sn) return; const x = c.getContext('2d');
  x.fillStyle = '#120d06'; x.fillRect(0, 0, c.width, c.height);
  x.fillStyle = '#f87171'; x.fillRect(sn.food.x * CELL + 3, sn.food.y * CELL + 3, CELL - 6, CELL - 6);
  sn.body.forEach((s, i) => { x.fillStyle = i ? '#ffb524' : '#fff0c2'; x.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2); });
}
async function snakeEnd() {
  const s = sn; s.over = true; clearInterval(s.timer);
  const pts = Math.max(CFG.snakePts.min, Math.min(s.score * CFG.snakePts.perFood, CFG.snakePts.max));
  $('snScore').textContent = `Game over! Score ${s.score} → +${pts} pts`;
  $('snEnd').innerHTML = againHtml(); updateAgain();
  try { await earn(pts); } catch (e) { toast('Error: points save nahi hue'); }
}

/* math quiz */
let qz = null;
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
function genQ() {
  const t = rnd(0, 2); let a, b, ans, txt;
  if (t === 0) { a = rnd(10, 99); b = rnd(10, 99); ans = a + b; txt = `${a} + ${b}`; }
  else if (t === 1) { a = rnd(30, 99); b = rnd(5, a - 5); ans = a - b; txt = `${a} − ${b}`; }
  else { a = rnd(3, 12); b = rnd(3, 12); ans = a * b; txt = `${a} × ${b}`; }
  const opts = new Set([ans]);
  while (opts.size < 4) { const d = rnd(1, 10) * (Math.random() < 0.5 ? -1 : 1); if (ans + d >= 0) opts.add(ans + d); }
  return { txt, ans, opts: [...opts].sort(() => Math.random() - 0.5) };
}
function quizStart() { qz = { i: 0, correct: 0, lock: false, q: genQ() }; quizDraw(); }
function quizDraw() {

}
async function quizAns(o) {

  const z = qz; z.lock = true;

  toast(ok ? '✅ Sahi!' : '❌ Galat, sahi jawab ' + z.q.ans);
  await sleep(700);
  if (qz !== z) return;
  z.i++;
  if (z.i >= CFG.quizPts.questions) return quizEnd(z);
  z.q = genQ(); z.lock = false; quizDraw();

}

/* sudoku */
let sd = null;
function sudokuGen() {
  const sh = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
  const pat = (r, c) => (3 * (r % 3) + Math.floor(r / 3) + c) % 9;
  const rows = [], cols = [];
  sh([0, 1, 2]).forEach(g => sh([0, 1, 2]).forEach(r => rows.push(g * 3 + r)));
  sh([0, 1, 2]).forEach(g => sh([0, 1, 2]).forEach(c => cols.push(g * 3 + c)));
  const nums = sh([1, 2, 3, 4, 5, 6, 7, 8, 9]);
  const sol = rows.map(r => cols.map(c => nums[pat(r, c)]));
  const puz = sol.map(r => r.slice());
  sh([...Array(81).keys()]).slice(0, CFG.sudokuPts.blanks).forEach(i => { puz[Math.floor(i / 9)][i % 9] = 0; });
  return { sol, puz };
}
function sudokuStart() {
  const g = sudokuGen();
  sd = { sol: g.sol, grid: g.puz.map(r => r.slice()), fixed: g.puz.map(r => r.map(v => v !== 0)), sel: null, mistakes: 0, over: false };
  sudokuDraw();
}
function sudokuDraw() {
  const cells = [];
  for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
    const v = sd.grid[r][c], sel = sd.sel && sd.sel[0] === r && sd.sel[1] === c;
    const same = sd.sel && v && sd.grid[sd.sel[0]][sd.sel[1]] === v;
    cells.push(`<button class="sdc${sd.fixed[r][c] ? ' fx' : ''}${sel ? ' sel' : ''}${same && !sel ? ' same' : ''}${c % 3 === 2 && c < 8 ? ' br' : ''}${r % 3 === 2 && r < 8 ? ' bb' : ''}" onclick="sudokuSel(${r},${c})">${v || ''}</button>`);
  }
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Sudoku</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <div class="muted">Galtiyan: ${sd.mistakes}/${CFG.sudokuPts.maxMistakes}  •  Khali dabbe pe tap karke number chuno</div>
    <div class="sdg">${cells.join('')}</div>
    <div class="sdpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button onclick="sudokuNum(${n})">${n}</button>`).join('')}</div>
    <button class="btn block ghost" style="margin-top:10px" onclick="sudokuEnd(false)">Give up</button></div>`;
}
function sudokuSel(r, c) { if (sd && !sd.over) { sd.sel = [r, c]; sudokuDraw(); } }
function sudokuNum(n) {
  if (!sd || sd.over) return;
  if (!sd.sel) return toast('Pehle koi khali dabba chuno');
  const [r, c] = sd.sel;
  if (sd.fixed[r][c] || sd.grid[r][c]) return;
  if (sd.sol[r][c] === n) {
    sd.grid[r][c] = n;
    if (sd.grid.every((row, i) => row.every((v, j) => v === sd.sol[i][j]))) return sudokuEnd(true);
  } else {
    sd.mistakes++; toast('❌ Galat number');
    if (sd.mistakes >= CFG.sudokuPts.maxMistakes) return sudokuEnd(false);
  }
  sudokuDraw();
}
async function sudokuEnd(solved) {
  const s = sd; if (!s || s.over) return; s.over = true;
  const P = CFG.sudokuPts, pts = solved ? Math.max(P.min, P.solved - s.mistakes * P.perMistake) : P.fail;
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Sudoku</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <h2 style="text-align:center;margin:18px 0">${solved ? '🎉 Sudoku poora!' : 'Game over'}</h2>
    <div style="text-align:center;font-weight:700">+${pts} points</div>${againHtml()}</div>`;
  updateAgain();
  try { await earn(pts); } catch (e) { toast('Error: points save nahi hue'); }
}

/* archery */
let ar = null;
function archeryStart() {
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Archery</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <div class="muted" id="arInfo"></div>
    <canvas id="arcv" width="300" height="260"></canvas>
    <button class="btn block" id="arShoot" onclick="archeryShoot()">🏹 SHOOT</button>
    <div class="muted" style="text-align:center;margin-top:6px">Target ka beech crosshair pe aaye tab SHOOT dabao</div>
    <div id="arEnd"></div></div>`;
  ar = { shot: 0, total: 0, ph: 0, last: performance.now(), tx: 150, ty: 120, over: false, raf: 0, cool: 0, msg: '' };
  archeryInfo(); ar.raf = requestAnimationFrame(archeryLoop);
}
function archeryInfo() {
  const P = CFG.archeryPts;
  $('arInfo').textContent = `Teer ${Math.min(ar.shot + 1, P.arrows)}/${P.arrows}  •  Score ${ar.total}${ar.msg ? '  •  ' + ar.msg : ''}`;
}
function archeryLoop(now) {
  if (!ar) return;
  const dt = Math.min(50, now - ar.last); ar.last = now;
  if (!ar.over) {
    ar.ph += dt * 0.0028 * (1 + ar.shot * 0.3);
    ar.tx = 150 + 95 * Math.sin(ar.ph); ar.ty = 120 + 40 * Math.sin(ar.ph * 1.7 + 1);
  }
  archeryDraw();
  ar.raf = requestAnimationFrame(archeryLoop);
}
function archeryDraw() {
  const c = $('arcv'); if (!c || !ar) return; const x = c.getContext('2d');
  x.fillStyle = '#0f2a1a'; x.fillRect(0, 0, 300, 260);
  ['#ffffff', '#111827', '#3b82f6', '#ef4444', '#facc15'].forEach((col, i) => {
    x.beginPath(); x.arc(ar.tx, ar.ty, 50 - i * 10, 0, 7); x.fillStyle = col; x.fill();
  });
  x.strokeStyle = '#ffb524'; x.lineWidth = 2; x.beginPath(); x.arc(150, 120, 9, 0, 7);
  x.moveTo(150, 100); x.lineTo(150, 140); x.moveTo(130, 120); x.lineTo(170, 120); x.stroke();
}
function archeryShoot() {
  if (!ar || ar.over || performance.now() < ar.cool) return;
  ar.cool = performance.now() + 450;
  const d = Math.hypot(ar.tx - 150, ar.ty - 120);
  const s = d < 10 ? 10 : d < 20 ? 8 : d < 30 ? 6 : d < 40 ? 4 : d < 50 ? 2 : 0;
  ar.total += s; ar.shot++; ar.msg = s ? `+${s}` : 'Miss';
  toast(s === 10 ? '🎯 Bullseye! +10' : s ? `+${s}` : 'Miss!');
  if (ar.shot >= CFG.archeryPts.arrows) return archeryEnd();
  archeryInfo();
}
async function archeryEnd() {
  const a = ar; a.over = true;
  const P = CFG.archeryPts, pts = Math.max(P.min, Math.min(a.total * P.perPoint, P.max));
  $('arInfo').textContent = `Game over! Score ${a.total}/${P.arrows * 10} → +${pts} pts`;
  $('arShoot').disabled = true; $('arEnd').innerHTML = againHtml(); updateAgain();
  try { await earn(pts); } catch (e) { toast('Error: points save nahi hue'); }
}
function archeryStop() { if (ar && ar.raf) cancelAnimationFrame(ar.raf); ar = null; }

/* table tennis */
let tn = null;
function tennisStart() {
  $('gamePanel').innerHTML = `<div class="card"><div class="row"><h3 class="grow">Table Tennis</h3><button class="btn sm ghost" onclick="closeGame()">Back</button></div>
    <div class="muted" id="tnInfo"></div>
    <canvas id="tcv" width="300" height="400"></canvas>
    <div class="muted" style="text-align:center">Neeche wale paddle ko ungli se left-right karo</div>
    <div id="tnEnd"></div></div>`;
  tn = { px: 150, cx: 150, ps: 0, cs: 0, bx: 150, by: 200, vx: 0, vy: 0, wait: 45, err: 0, over: false, raf: 0 };
  tennisServe(1);
  const cv = $('tcv');
  const mv = e => { const r = cv.getBoundingClientRect(); if (tn) tn.px = Math.max(32, Math.min(268, (e.clientX - r.left) * (300 / r.width))); };
  cv.onpointermove = mv; cv.onpointerdown = mv;
  tennisInfo(); tn.raf = requestAnimationFrame(tennisLoop);
}
function tennisServe(dir) { tn.bx = 150; tn.by = 200; tn.vx = (Math.random() - 0.5) * 3; tn.vy = 3.6 * dir; tn.wait = 45; }
function tennisInfo() { $('tnInfo').textContent = `Aap ${tn.ps} - ${tn.cs} Computer  •  Pehle ${CFG.tennisPts.target} point jeetne wala jeetega`; }
function tennisLoop() {
  const t = tn; if (!t) return;
  if (!t.over) {
    const aim = t.vy < 0 ? t.bx + t.err : 150, spd = 2.7;
    t.cx += Math.max(-spd, Math.min(spd, aim - t.cx));
    t.cx = Math.max(32, Math.min(268, t.cx));
    if (t.wait > 0) t.wait--;
    else {
      const prev = t.by;
      t.bx += t.vx; t.by += t.vy;
      if (t.bx < 6 || t.bx > 294) { t.vx = -t.vx; t.bx = Math.max(6, Math.min(294, t.bx)); }
      if (t.vy > 0 && prev < 372 && t.by >= 372 && Math.abs(t.bx - t.px) <= 38) {
        t.vy = -Math.min(9.5, Math.abs(t.vy) * 1.06); t.vx = (t.bx - t.px) / 38 * 5.5; t.by = 371; t.err = (Math.random() - 0.5) * 80;
      } else if (t.vy < 0 && prev > 28 && t.by <= 28 && Math.abs(t.bx - t.cx) <= 38) {
        t.vy = Math.min(9.5, Math.abs(t.vy) * 1.05); t.vx = (t.bx - t.cx) / 38 * 4 + (Math.random() - 0.5); t.by = 29;
      } else if (t.by > 404) { t.cs++; tennisPoint(1); }
      else if (t.by < -4) { t.ps++; tennisPoint(-1); }
    }
  }
  tennisDraw();
  if (tn) t.raf = requestAnimationFrame(tennisLoop);
}
function tennisPoint(dir) {
  tennisInfo();
  if (tn.ps >= CFG.tennisPts.target || tn.cs >= CFG.tennisPts.target) return tennisEnd();
  tennisServe(dir);
}
function tennisDraw() {
  const c = $('tcv'); if (!c || !tn) return; const x = c.getContext('2d'), t = tn;
  x.fillStyle = '#0b3d5c'; x.fillRect(0, 0, 300, 400);
  x.strokeStyle = '#ffffff55'; x.lineWidth = 2; x.setLineDash([8, 8]); x.beginPath(); x.moveTo(0, 200); x.lineTo(300, 200); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#f87171'; x.fillRect(t.cx - 32, 20, 64, 8);
  x.fillStyle = '#ffb524'; x.fillRect(t.px - 32, 372, 64, 8);
  x.fillStyle = '#fff'; x.beginPath(); x.arc(t.bx, t.by, 6, 0, 7); x.fill();
}
async function tennisEnd() {
  const t = tn; t.over = true;
  const win = t.ps > t.cs, pts = win ? CFG.tennisPts.win : CFG.tennisPts.lose;
  $('tnInfo').textContent = `${win ? '🎉 Aap jeet gaye!' : 'Computer jeet gaya'}  ${t.ps} - ${t.cs}  → +${pts} pts`;
  $('tnEnd').innerHTML = againHtml(); updateAgain();
  try { await earn(pts); } catch (e) { toast('Error: points save nahi hue'); }
}
function tennisStop() { if (tn && tn.raf) cancelAnimationFrame(tn.raf); tn = null; }

/* har second timers update */
function tick() {
  if (!U) return;
  if ($('v-tasks').classList.contains('on')) renderAds();
  if ($('v-games').classList.contains('on')) renderGamesInfo();
}

/* ---------- refer ---------- */
const refUrl = () => `https://t.me/${CFG.botUsername}/${CFG.appShortName}?startapp=ref_${tid}`;
function renderRefer() {
  $('refText').textContent = `Dost ko invite karo. Jab wo pehli baar kamayega, aapko +${CFG.refBonus.referrer} aur use +${CFG.refBonus.newUser} points milenge.`;
  $('refLink').value = refUrl();
  $('refCount').textContent = U.referralCount || 0;
  $('refEarn').textContent = fmt((U.referralCount || 0) * CFG.refBonus.referrer);
}
function copyRef() {
  navigator.clipboard.writeText(refUrl()).then(() => toast('Link copy ho gaya'), () => { $('refLink').select(); toast('Link select karke copy karo'); });
}
function shareRef() {
  const t = encodeURIComponent('Ye app try karo, daily spin aur games se points kamao!');
  const u = 'https://t.me/share/url?url=' + encodeURIComponent(refUrl()) + '&text=' + t;
  TG && TG.openTelegramLink ? TG.openTelegramLink(u) : window.open(u, '_blank');
}

/* ---------- profile / withdraw ---------- */
function renderProfile() {
  $('pBal').textContent = fmt(U.points); $('pTot').textContent = fmt(U.totalEarned);
  $('rateInfo').textContent = `${fmt(CFG.pointsPerINR)} pts = ₹1  •  ${fmt(CFG.pointsPerUSDT)} pts = 1 USDT  •  Min ₹${CFG.minINR} / ${CFG.minUSDT} USDT`;
  calcPts();
}
function setMethod(m) {
  method = m;
  $('mUPI').classList.toggle('ghost', m !== 'UPI'); $('mUSDT').classList.toggle('ghost', m !== 'USDT');
  $('netBox').style.display = m === 'USDT' ? 'block' : 'none';
  $('addrLbl').textContent = m === 'UPI' ? 'UPI ID' : 'USDT wallet address';
  $('addr').placeholder = m === 'UPI' ? 'name@upi' : 'T... (TRC20) ya 0x... (BEP20)';
  $('amtLbl').textContent = m === 'UPI' ? 'Amount (₹)' : 'Amount (USDT)';
  calcPts();
}
function needPts() {
  const a = parseFloat($('amt').value) || 0;
  return method === 'UPI' ? Math.round(a) * CFG.pointsPerINR : Math.ceil(a * CFG.pointsPerUSDT);
}
function calcPts() { const p = needPts(); $('ptsNeed').textContent = p ? `Points lagenge: ${fmt(p)}` : ''; }
async function loadHistory() {
  try {
    const q = await db.collection('withdrawals').where('uid', '==', auth.currentUser.uid).get();
    const rows = q.docs.map(d => d.data()).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
    $('hist').innerHTML = rows.length ? rows.map(r =>
      `<div class="item"><div>${esc(r.method)} • ${r.currency === 'INR' ? '₹' : ''}${esc(r.amount)}${r.currency === 'USDT' ? ' USDT' : ''}<div class="muted">${esc(r.address)}</div></div><b class="st-${esc(r.status)}">${esc(r.status)}</b></div>`).join('')
      : 'Abhi tak koi withdrawal nahi.';
  } catch (e) { $('hist').textContent = 'History load nahi hui.'; }
}
async function withdraw() {
  if (busy) return;
  const addr = $('addr').value.trim(), a = parseFloat($('amt').value) || 0, pts = needPts();
  if (method === 'UPI') {
    if (!/^[\w.\-]{2,}@[\w]{2,}$/.test(addr)) return toast('Sahi UPI ID daalo');
    if (a < CFG.minINR) return toast(`Minimum ₹${CFG.minINR}`);
  } else {
    const net = $('net').value;
    const ok = net === 'TRC20' ? /^T[1-9A-HJ-NP-Za-km-z]{33}$/.test(addr) : /^0x[a-fA-F0-9]{40}$/.test(addr);
    if (!ok) return toast(`Sahi ${net} address daalo`);
    if (a < CFG.minUSDT) return toast(`Minimum ${CFG.minUSDT} USDT`);
  }
  if (pts > U.points) return toast('Points kam hain');
  if (!confirm(`${method} withdrawal: ${fmt(pts)} points katenge. Address sahi hai?\n${addr}`)) return;
  busy = true; $('wBtn').disabled = true;
  try {
    const b = db.batch();
    b.set(db.collection('withdrawals').doc(), {
      uid: auth.currentUser.uid, tid, name: U.name,
      method: method === 'USDT' ? 'USDT-' + $('net').value : 'UPI',
      address: addr, amount: method === 'UPI' ? Math.round(a) : a, currency: method === 'UPI' ? 'INR' : 'USDT',
      points: pts, status: 'pending', createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    b.update(ref, { points: inc(-pts) });
    await b.commit();
    U.points -= pts; $('amt').value = ''; renderAll(); loadHistory();
    toast('Request bhej di gayi ✓');
  } catch (e) { toast('Request fail hui'); console.error(e); }
  busy = false; $('wBtn').disabled = false;
}

init().catch(e => { console.error(e); $('boot').innerHTML = '<div><h3>Error</h3><p class="muted">' + esc(e.message) + '</p></div>'; });
</script>
